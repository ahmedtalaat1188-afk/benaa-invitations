<div class="designer-container animate-fade" style="padding: 2rem;">
  <header style="margin-bottom: 2rem;">
    <h2 style="font-size: 1.8rem; font-weight: 700; color: var(--primary-color);">مصمم الدعوات الذكي</h2>
    <p style="color: var(--text-muted);">صمم دعوة احترافية باستخدام الذكاء الاصطناعي في ثوانٍ</p>
  </header>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
    <!-- Control Panel -->
    <div class="glass-card" style="display: flex; flex-direction: column; gap: 1.5rem;">
      <h3 style="font-weight: 600; border-right: 3px solid var(--secondary-color); padding-right: 0.5rem;">تنسيق المحتوى</h3>
      
      <div class="form-group">
        <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">عنوان الفعالية</label>
        <input type="text" placeholder="مثلاً: حفل تخرج KG بنات" style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid #e2e8f0;">
      </div>

      <div class="form-group">
        <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">مواصفات التصميم (AI Prompt)</label>
        <textarea rows="3" placeholder="اكتب وصفاً للتصميم (مثلاً: تصميم ناعم، ألوان وردية، مخصص للأطفال)" style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid #e2e8f0;"></textarea>
      </div>

      <div class="style-selector" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem;">
        <button class="btn" style="background: var(--bg-color); font-size: 0.8rem; border: 1px solid var(--primary-color);">عصري (Modern)</button>
        <button class="btn" style="background: var(--bg-color); font-size: 0.8rem;">عربي أصيل</button>
        <button class="btn" style="background: var(--bg-color); font-size: 0.8rem;">أطفال / مرح</button>
      </div>

      <button class="btn btn-primary" style="margin-top: 1rem; width: 100%; justify-content: center;">✨ توليد التصميم بالذكاء الاصطناعي</button>
    </div>

    <!-- Preview Area -->
    <div style="display: flex; flex-direction: column; gap: 1rem;">
      <h3 style="font-weight: 600;">معاينة الدعوة</h3>
      
      <div id="invitation-preview" class="glass-card" style="aspect-ratio: 4/5; position: relative; padding: 0; overflow: hidden; background: linear-gradient(135deg, #fff 0%, #f1f5f9 100%);">
        <!-- AI Generated Background Image Placeholder -->
        <div style="position: absolute; inset: 0; background: url('assets/images/template-placeholder.png') center/cover; opacity: 0.6;"></div>
        
        <!-- Live Text Overlay -->
        <div style="position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem;">
          <img src="assets/images/school-logo.png" height="50" alt="شعار المدرسة" style="margin-bottom: 1rem;">
          <h1 style="font-size: 2rem; color: #1e293b; margin-bottom: 0.5rem;">اسم الفعالية هنا</h1>
          <p style="font-size: 1.1rem; color: #64748b;">نتشرف بدعوتكم لحضور حفلنا السنوي</p>
          
          <div style="margin-top: 2rem; padding: 1rem; background: rgba(255,255,255,0.8); border-radius: var(--radius);">
            <div style="font-weight: 700; color: var(--primary-color);">التاريخ: 15 رجب 1447هـ</div>
            <div style="font-weight: 700;">الموقع: مسرح المدرسة الرئيسي</div>
          </div>
          
          <!-- Mock QR on Invitation -->
          <div style="margin-top: auto; padding: 1rem; background: white; border-radius: 8px;">
            <div style="width: 80px; height: 80px; background: #eee; border: 1px dashed #ccc; display: flex; align-items: center; justify-content: center; font-size: 0.6rem;">كود QR</div>
          </div>
        </div>
      </div>

      <div style="display: flex; gap: 1rem;">
        <button class="btn btn-primary" style="flex: 1; justify-content: center;">حفظ واعتماد</button>
        <button class="btn" style="flex: 1; justify-content: center; background: #25d366; color: white;">إرسال نسخة تجريبية واتساب</button>
      </div>
    </div>
  </div>
</div>
